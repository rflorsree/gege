schema: spec-driven

context: |
  Gege Tel lanzará en ocho semanas un portal empresarial y beneficios para titulares de línea por web y WhatsApp.
  Equipo: cuatro personas. Entregable actual: arquitectura y especificación; no existe implementación.
  Componentes acordados: API de negocio, sincronizadores de proveedores y ejecución de IA; una base PostgreSQL cuyo acceso de aplicación pertenece a la API.
  Un crédito se reserva por respuesta del asistente y se confirma al entregarse: WhatsApp exige estado delivered/read, no solo envío aceptado.
  Escribir en español. Mantener los encabezados estructurales y SHALL/MUST de OpenSpec en inglés.

rules:
  proposal:
    - Justificar el alcance para cuatro personas y ocho semanas; declarar lo que queda fuera del piloto.
  specs:
    - Cuando una capacidad usa datos empresariales, incluir un escenario de acceso denegado entre tenants o líneas.
    - Cuando depende de un proveedor, especificar qué ve el usuario si los datos están atrasados, faltan o el proveedor falla.
    - Cuando afecta créditos o facturas, cubrir duplicados, reintentos y estados pendientes sin prometer éxito antes de confirmarlo.
  design:
    - Identificar dueño de cada dato, origen del tenant y autorización en cada límite entre componentes.
    - Explicar cómo se concilian eventos duplicados o tardíos de WhatsApp y respuestas ambiguas del PAC.
    - Justificar cualquier componente nuevo frente al plazo de ocho semanas y su costo operativo.
  tasks:
    - Asociar cada hito con evidencia de aceptación; incluir pruebas de dos tenants, créditos concurrentes y fallos de proveedor cuando aplique.
